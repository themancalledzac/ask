[project]
name = "ask"
version = "0.1.0"
description = "Answer where, who and status questions from repos you add."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ask = "ask.cli:main"
ask-mcp = "ask.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
